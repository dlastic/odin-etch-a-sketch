<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etch-a-Sketch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Etch-a-Sketch</h1>
    <div class="eas-container">
      <div class="grid-container"></div>
      <div class="button-container">
        <button id="grid-size" class="active-change">Grid Size</button>
        <button id="color-change" class="active-change">Change Color</button>
        <input type="color" id="color-picker" class="color-picker">
        <button id="rainbow-mode">Rainbow Mode</button>
        <button id="clear" class="active-change">Clear</button>
      </div>
    </div>
  </main>
  <script src="index.js"></script>
</body>
</html>
